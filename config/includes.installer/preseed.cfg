d-i mirror/country string manual
d-i mirror/protocol string https
d-i mirror/https/hostname string arsip-dev.blankonlinux.id
d-i mirror/https/directory string /sinambung
d-i mirror/suite string sinambung
d-i mirror/codename string sinambung
d-i mirror/udeb/suite string sinambung
d-i mirror/https/proxy string

d-i apt-setup/use_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/enable-source-repositories boolean false
d-i apt-setup/non-free boolean false
d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/services-select multiselect
